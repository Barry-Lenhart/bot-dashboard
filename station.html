<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Bot Station</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#d8f3ff;--dim:#6f8aa6;--cyan:#22e4ff;--green:#3dffa2;--red:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:#06030d radial-gradient(ellipse at 50% 0,#1a0c33 0,#06030d 60%) fixed;color:var(--ink);font:14px/1.45 "Share Tech Mono",ui-monospace,monospace;min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 20px Orbitron,sans-serif;letter-spacing:3px;margin:0;color:#ffcf7a;text-shadow:0 0 12px #ff9d2a88}
.spacer{flex:1}
a.btn,button{font:500 11px Orbitron,sans-serif;letter-spacing:1px;background:#1a0d33;color:#d9c2ff;border:1px solid #5b34a3;border-radius:20px;padding:8px 14px;cursor:pointer;text-decoration:none}
button.on{background:#9d6bff;color:#0b0118;box-shadow:0 0 14px #9d6bff}
.main{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.stage{flex:0 1 960px;min-width:0;position:relative}
#dlg{position:absolute;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,calc(100% - 16px))}
.dlg-wake{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #4b2a86}.dlg-wake button{background:#ff9a3d;color:#1a0d33;border:0;border-radius:6px;padding:6px 12px;font:700 12px Orbitron,monospace;cursor:pointer;white-space:nowrap}.dlg-wake button:disabled{background:#3a2466;color:#c9a7ff;cursor:default}.dlg-wake span{font-size:12px;color:#c9a7ff}
.dlg{background:linear-gradient(160deg,#160c2cf4,#07040ff4);border:2px solid var(--c);border-radius:6px;box-shadow:0 0 0 2px #000,0 0 26px color-mix(in srgb,var(--c) 45%,transparent);font-size:12px}
.dlg-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #2c2050}
.dlg-name{font:700 13px Orbitron,sans-serif;letter-spacing:1px;color:var(--c);text-shadow:0 0 8px var(--c)}
.dlg-role{color:var(--dim);font-size:11px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg-title{font:700 9px Orbitron,sans-serif;letter-spacing:2px;color:#b9a6ff;white-space:nowrap}
button.dlg-x{padding:1px 9px;border-radius:4px;font-size:14px;line-height:1.2}
.dlg-body{max-height:min(220px,32vh);overflow:auto;padding:4px 10px 8px}
.dlg-line{display:grid;grid-template-columns:38px 70px 1fr;gap:6px;padding:5px 0;border-bottom:1px dashed #241a3e;word-break:break-word}
.dlg-t{color:var(--dim)}.dlg-k{font:700 9px Orbitron,sans-serif;letter-spacing:1px;padding-top:2px;color:#9fb3cc}
.tone-buy .dlg-k,.tone-gain .dlg-k{color:var(--green)}.tone-loss .dlg-k{color:var(--red)}.tone-quiet .dlg-m{color:#9aa6bd;font-style:italic}
.dlg-empty{color:var(--dim);padding:10px 0}
canvas{display:block;width:100%;height:auto;border:1px solid #3a2466;border-radius:8px;box-shadow:0 0 30px #7a3cff2a;background:#020108;cursor:pointer}
.side{flex:1;min-width:270px;display:flex;flex-direction:column;gap:10px}
.box{background:linear-gradient(160deg,#21104acc,#10061fcc);border:1px solid #4b2a86;border-radius:8px;padding:12px;box-shadow:0 0 16px #7a3cff22}
.box h2{font:700 11px Orbitron,sans-serif;letter-spacing:2px;margin:0 0 8px;color:#c9a7ff}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.feed{font-size:12px;max-height:340px;overflow:auto}.feed div{padding:5px 0;border-bottom:1px solid #2c1a52;word-break:break-word}
.g{color:var(--green)}.r{color:var(--red)}.d{color:var(--dim)}
.replay{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}
.bar{flex:1;height:6px;background:#1a0d33;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff3df2,var(--cyan))}
.note{font-size:11px;color:var(--dim)}
.hidden{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock .box{max-width:380px;width:100%}
#lock input[type=password]{width:100%;font:inherit;background:#020812;color:var(--ink);border:1px solid #1f6a9a;border-radius:8px;padding:10px;margin:10px 0}
#follow .k{color:var(--dim)}
@media (max-width:640px){.wrap{padding:12px}h1{font-size:16px}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h2>BOT STATION // LOCKED</h2>
  <p class="note">The data is encrypted. Enter your dashboard password (the same one as Bot HQ).</p>
  <input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
  <label class="note"><input id="rem" type="checkbox" checked> Remember me on this device</label>
  <div style="height:10px"></div><button id="unlock">UNLOCK</button>
  <p class="note" id="lockmsg"></p>
</div></div>

<div id="app" class="wrap hidden">
  <header>
    <h1>BOT STATION</h1><div class="spacer"></div>
    <button id="replayBtn">▶ REPLAY LAST SESSION</button>
    <a class="btn" href="./">BOT HQ</a>
  </header>
  <div class="main">
    <div class="stage"><canvas id="c" width="1920" height="2304"></canvas><div id="dlg" class="hidden"></div></div>
    <div class="side">
      <div class="box"><h2 id="status">CONNECTING…</h2>
        <div class="replay" id="replayRow"><span id="replayLbl">LIVE</span><div class="bar"><i id="prog"></i></div></div></div>
      <div class="box"><h2>UNITS // LAST SESSION</h2><div id="units"></div></div>
      <div class="box hidden" id="follow"></div>
      <div class="box"><h2>STATION LOG</h2><div class="feed" id="feed"></div></div>
      <p class="note">Tap a bot to open its chat. Everything shown comes from the bots' real logs; nothing here can place or change a trade.</p>
    </div>
  </div>
</div>

<script src="station-art.js"></script>
<script src="station-sprites.js"></script>
<script src="station-furniture.js"></script>
<script src="station-tech.js"></script>
<script src="station-machines.js"></script>
<script src="station-crew.js"></script>
<script src="station-comms.js"></script>
<script src="station-web.js"></script>
<script src="station-walls.js"></script>
<script src="station-chat.js"></script>
<script src="station-dialog.js"></script>
<script>
// ===================== unlock (same scheme and saved key as Bot HQ) =====================
const DATA_URL = "https://raw.githubusercontent.com/Barry-Lenhart/bot-dashboard/data/data.enc.json";
const STORE = "bothq.key.v1";
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveRaw(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter}, base, 256);
}
async function decrypt(box, raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(box.iv)}, key, b64d(box.ct))));
}
const saved = () => { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch { return null; } };
const save = v => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} };
async function fetchBox() { const r = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) throw new Error("Couldn't download the data (" + r.status + ")"); return r.json(); }
let session = null, box = null;
async function boot() {
  try { box = await fetchBox(); } catch (e) { $("lockmsg").textContent = e.message; return; }
  const s = saved();
  if (s && s.salt === box.salt) { try { const d = await decrypt(box, b64d(s.raw)); session = {salt: s.salt, raw: b64d(s.raw)}; return start(d); } catch {} }
  $("pw").focus();
}
async function unlock() {
  const pw = $("pw").value; if (!pw) return;
  $("lockmsg").textContent = "Unlocking…";
  try { box = await fetchBox(); const raw = await deriveRaw(pw, box.salt, box.iter); const d = await decrypt(box, raw);
    session = {salt: box.salt, raw}; if ($("rem").checked) save({salt: box.salt, raw: b64e(raw)}); $("pw").value = ""; start(d);
  } catch (e) { $("lockmsg").textContent = "Wrong password, or the data couldn't be read."; }
}
async function refresh() {
  try { box = await fetchBox(); if (session.salt !== box.salt) { save(null); location.reload(); return; } setData(await decrypt(box, session.raw)); } catch {}
}
$("unlock").onclick = unlock; $("pw").onkeydown = e => { if (e.key === "Enter") unlock(); };

// ===================== the station map =====================
const C = $("c"), X = C.getContext("2d"), T = 16, W = 60, H = 72, MW = W * T, MH = H * T, F = '"Share Tech Mono",monospace';
// Rooms are floor areas (in 16px tiles) floating in space; corridors join them. Only floors are walkable.
const ROOMS = [
  {k:'sp',   x:2,  y:3,  w:12, h:11, l:"POD 01 // SPENCER", c:'#4da3ff'}, {k:'ai',  x:2,  y:16, w:12, h:11, l:"POD 02 // AVA", c:'#ffb03d'},
  {k:'deck', x:17, y:3,  w:26, h:22, l:"COMMAND DECK", c:'#22e4ff'},      {k:'ch',  x:46, y:3,  w:12, h:11, l:"POD 03 // CHAD", c:'#3dffa2'},
  {k:'mem',  x:46, y:16, w:12, h:11, l:"MEMORY CORE", c:'#9d6bff'},       {k:'brief', x:2, y:29, w:26, h:10, l:"BRIEFING ROOM", c:'#ff3df2'},
  {k:'sim',  x:32, y:29, w:26, h:10, l:"SIMULATION CHAMBER", c:'#22ffd5'},
  {k:'jace', x:2,  y:41, w:18, h:8,  l:"POD 04 // JACE (TWIN)", c:'#ff5fa2'}, {k:'spare', x:24, y:41, w:12, h:8, l:"POD 06 // WEB SCOUT", c:'#ff9a3d'},
  {k:'jax',  x:40, y:41, w:18, h:8,  l:"POD 05 // JAX (TWIN)", c:'#ffe14d'},
  {k:'fac',  x:2,  y:52, w:56, h:11, l:"WEB FOUNDRY", c:'#ff9a3d'}];
const room = k => ROOMS.find(r => r.k === k);
const CORRIDORS = [[14,7,3,3],[43,7,3,3],[10,14,3,2],[14,20,3,3],[43,20,3,3],[54,14,3,2],[40,25,3,4],
  [10,27,3,2],[47,27,3,2],[28,32,4,3],[33,39,3,2],[20,44,4,3],[36,44,4,3],
  [9,49,3,3],[28,49,4,3],[48,49,3,3]];
const walk = [...Array(H)].map(() => Array(W).fill(false));
ROOMS.map(r => [r.x, r.y, r.w, r.h]).concat(CORRIDORS).forEach(([x, y, w, h]) => {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) walk[j][i] = true; });
const WALL_ROWS = 3;                                     // the back (north) wall of a room is this many tiles tall
const northDoors = r => CORRIDORS.filter(([x, y, w, h]) => y + h === r.y && x >= r.x && x + w <= r.x + r.w);
ROOMS.forEach(r => { const open = new Set(northDoors(r).flatMap(([x, , w]) => [...Array(w)].map((_, i) => x + i)));
  for (let j = r.y; j < r.y + WALL_ROWS; j++) for (let i = r.x; i < r.x + r.w; i++) if (!open.has(i)) walk[j][i] = false; });
function path(a, b) {
  const k = (x, y) => y * W + x, sx = Math.round(a[0]), sy = Math.round(a[1]), tx = Math.round(b[0]), ty = Math.round(b[1]);
  const prev = new Map([[k(sx, sy), -1]]), q = [[sx, sy]];
  while (q.length) { const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || !walk[ny][nx] || prev.has(k(nx, ny))) continue; prev.set(k(nx, ny), k(x, y)); q.push([nx, ny]); } }
  if (!prev.has(k(tx, ty))) return [];
  const out = []; let c = k(tx, ty); while (c !== -1) { out.unshift([c % W, Math.floor(c / W)]); c = prev.get(c); }
  const s = []; out.forEach((p, i) => { if (i === 0 || i === out.length - 1) { s.push(p); return; } const p0 = out[i - 1], p1 = out[i + 1];
    if (p0[0] - p[0] !== p[0] - p1[0] || p0[1] - p[1] !== p[1] - p1[1]) s.push(p); });
  s.shift(); s.push(b); return s;
}
const P = {desk_sp:[7,7],desk_ai:[7,20],desk_ch:[51,7],screen:[26,10],screen2:[33,10],news:[21,17],globe:[30,22],globe2:[35,22],
  crystal:[52,23],seat_sp:[9,35.3],seat_ai:[15,35],seat_ch:[21,35.3],dock_sp:[4,11],dock_ai:[4,24],dock_ch:[55,11],
  sim:[42,33],sim2:[38,32],sim3:[44,36],lounge:[25,20],term1:[39,14],term2:[39,23],term3:[20,23],pod_sp:[11,11],pod_ai:[11,24],pod_ch:[48,11],
  desk_jace:[5,45],dock_jace:[3,47],pod_jace:[13,47.5],desk_jax:[54,45],dock_jax:[56,47],pod_jax:[45,47.5],
  seat_jace:[25,35],seat_jax:[4,35],desk_sc:[29.5,45.6],dock_sc:[34,47],press_sc:[9.5,57.6],tray_sc:[39.6,16.6],dish_sc:[41.2,8.6],holo_sc:[30,21],sim_jace:[35,32],sim_jace2:[36,37],sim_jax:[40,37],sim_jax2:[44,33]};
const WANDER = {sp:['desk_sp','screen','lounge','pod_sp','globe'], ai:['desk_ai','news','globe2','term3','pod_ai'],
  ch:['desk_ch','screen2','globe','term1','term2','news','pod_ch'],
  jace:['desk_jace','pod_jace','screen','term3','news','lounge'], jax:['desk_jax','pod_jax','screen2','globe2','term1','term2']};
const TWINS = ['jace', 'jax'], twin = id => TWINS.includes(id);

// ===================== bots =====================
const BOTS = [{id:'sp',name:'SPENCER',role:'S&P bot · real money',col:'#4da3ff'},{id:'ai',name:'AVA',role:'AI day trader · paper',col:'#ffb03d'},
  {id:'ch',name:'CHAD',role:'chatbot · paper · the control',col:'#3dffa2'},
  {id:'jace',name:'JACE',role:'twin · simulated',col:'#ff5fa2'},{id:'jax',name:'JAX',role:'twin · simulated',col:'#ffe14d'}];
const B = {}; BOTS.forEach(b => { B[b.id] = b; Object.assign(b, {p:P['dock_' + b.id].slice(), path:[], dir:1, walk:0, say:null, sayT:0, wait:0,
  q:[], evq:[], chg:true, speak:0, recent:[]}); });
let boardTitle = 'BRIEFING // DAILY RESULTS', D = null, tick = 0, talk = null, board = [], meet = null, phase = null, mode = 'live', following = null;
const floaters = [], feed = [];
const clean = s => (s || '').replace(/\s*--\s*\d{4}-\d\d-\d\d/g, '').replace(/\b\d{4}-\d\d-\d\d\b/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B1C}\u{2B1B}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();
const first = s => clean((s || '').replace(/^switch ON \| /, 'Checked: ').split(' | ')[0]);
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(html) { feed.unshift(html); feed.length = Math.min(feed.length, 40); $("feed").innerHTML = feed.map(x => '<div>' + x + '</div>').join(''); }
function say(b, text, cls, full) {
  b.say = cut(text, 58); b.sayT = 240;
  log(`<span class="${cls || ''}"><b style="color:${b.col}">${b.name}:</b> ${esc(cut(full || text, 260))}</span>`);
  b.recent.unshift(full || text); b.recent.length = Math.min(b.recent.length, 6); if (following === b) showFollow();
}
function goTo(b, place) { b.chg = false; b.path = path(b.p, typeof place === 'string' ? P[place] : place); }
function charge(b) { if (b.chg) return; goTo(b, 'dock_' + b.id); b.q.push(() => { b.chg = true; }); }
function fastF() { return mode === 'replay' ? 0.4 : 1; }     // replay moves the story along faster

// what a real event looks like on the station: where the bot walks, and what it says there
function placeFor(bot, kind, text) {
  if (phase === 'practice') return twin(bot) ? ['sim_' + bot, 'sim_' + bot + '2'][text.length % 2] : ['sim', 'sim2', 'sim3'][text.length % 3];
  if (kind === 'buy' || kind === 'sell' || kind === 'order' || kind === 'plan' || kind === 'check') return 'desk_' + bot;
  if (kind === 'news' || kind === 'brief' || /headline|news/i.test(text)) return 'news';
  if (kind === 'note') return 'crystal';
  if (kind === 'watch') return 'globe2';
  if (bot === 'ch' || twin(bot)) return ['screen2', 'globe', 'term1', 'term2', 'screen'][(text.length) % 5];
  return bot === 'sp' ? 'screen' : 'term3';
}
function act(b, ev) {
  const [, kind, text] = ev, place = placeFor(b.id, kind, text);
  goTo(b, place);
  b.q.push(() => {
    const cls = kind === 'buy' ? 'g' : kind === 'sell' ? (/-\d|−/.test(first(text)) ? 'r' : 'g') : kind === 'think' || kind === 'scan' ? 'd' : '';
    say(b, kind === 'note' ? 'note: ' + first(text) : first(text), cls, clean(text));
    if (kind === 'sell') { const m = first(text).match(/([+\-−]\d+(\.\d+)?%)/); if (m) floaters.push({x:b.p[0]*T+8, y:b.p[1]*T-30, t:0, s:m[1], c: /[-−]/.test(m[1]) ? '#ff4d6d' : '#3dffa2'}); }
    if (kind === 'buy') floaters.push({x:b.p[0]*T+8, y:b.p[1]*T-30, t:0, s:'BUY', c:'#3dffa2'});
    b.wait = (kind === 'think' ? 260 : 200) * fastF();
  });
}
function queueEvent(b, ev) {
  b.evq.push(ev);
  const keep = e => ['buy', 'sell', 'order', 'summary', 'review'].includes(e[1]);
  while (b.evq.length > 3) { const i = b.evq.findIndex(e => !keep(e)); b.evq.splice(i < 0 ? 0 : i, 1); }   // never fall far behind
}

// ===================== facts for small talk (only things the bots really did) =====================
function evOf(bot) { return twin(bot) ? (((D.station.twins || {})[bot] || {}).events || []) : (D.station.bots[bot].events || []); }
function lastOf(bot, kinds) { const ev = D ? evOf(bot) : []; for (let i = ev.length - 1; i >= 0; i--) if (kinds.includes(ev[i][1])) return ev[i]; return null; }
function dayLine(bot) {
  if (twin(bot)) { const c = D[bot] || {}; const n = (c.trades || []).filter(t => t.day === c.day).length; return `${n} sale${n === 1 ? '' : 's'} so far, ${fmtPct(pct(bot))} on the day.`; }
  if (bot === 'ch') { const c = D.chat || {}; const n = (c.trades || []).filter(t => t.day === (c.day)).length; return `${n} sale${n === 1 ? '' : 's'} so far, ${fmtPct(pct('ch'))} on the day.`; }
  if (bot === 'ai') { const a = D.ai || {}; return a.hold ? `Holding ${a.hold.sym}. ${fmtPct(pct('ai'))} on the day.` : `No position right now. ${fmtPct(pct('ai'))} on the day.`; }
  const l = D.live || {}; return `Holding ${(l.positions || []).map(p => p.sym).join(' and ') || 'cash'}. ${fmtPct(pct('sp'))} on the day.`;
}
function makeTalk(a, o) {
  const opts = [];
  const cb = lastOf(o.id, ['buy']), parts = cb ? cb[2].split(' | ') : [];
  if ((o.id === 'ch' || twin(o.id)) && cb) opts.push([[a.id, `Saw you ${first(parts[0]).replace('BOUGHT', 'bought').replace(/\(.*?\)/, '').trim()}. Plan?`], [o.id, clean(parts[1] || 'Watching it closely.')]]);
  const an = lastOf('ai', ['news', 'watch']);
  if (o.id === 'ai' && an) opts.push([[a.id, 'Anything in the news?'], ['ai', first(an[2])]]);
  opts.push([[a.id, 'How is your day going?'], [o.id, dayLine(o.id)], [a.id, dayLine(a.id)]]);
  return opts[(tick / 7 | 0) % opts.length];
}

// ===================== results =====================
function sessionDay() { const m = D.station.market; return m.is_open ? D.generated.slice(0, 10) : (m.last_close || '').slice(0, 10); }
function pct(bot) {
  const s = bot === 'sp' ? D.live : bot === 'ai' ? D.ai : bot === 'ch' ? D.chat : D[bot]; if (!s || s.error) return null;
  if (!s.history || !s.history.length) return s.equity && s.start_equity ? s.equity / s.start_equity - 1 : null;
  const h = s.history.filter(x => x.eq), last = h[h.length - 1];
  if (!last) return null;
  const prev = h.length >= 2 ? h[h.length - 2].eq : (s.start_equity || s.put_in);
  if (last.d === sessionDay() && prev) return (last.eq - (last.dep || 0)) / prev - 1;
  return s.equity / last.eq - 1;
}
const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
function units() {

function next(b) {
  if (b.q.length) { b.q.shift()(); return; }
  if (twin(b.id) && !twinsOn()) { charge(b); return; }      // the twins haven't started yet
  if (phase === 'trading' || (phase === 'practice' && practicing(b.id))) {
    if (b.evq.length) { act(b, b.evq.shift()); return; }
    if (phase === 'practice') return;
    // nothing new from this bot: small talk now and then, otherwise wander the station
    if (!talk && Math.random() < 0.35) { const ok = BOTS.filter(x => x !== b && !x.path.length && !x.evq.length && !x.chg && !((b.id === 'ch' && twin(x.id)) || (x.id === 'ch' && twin(b.id))));
      const o = ok[Math.random() * ok.length | 0];
      if (o) { talk = {a: b, o, lines: makeTalk(b, o), i: -1, t: 0, ready: false}; o.wait = 99999; o.q = [];
        const t = [[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy]) => [Math.round(o.p[0]) + dx, Math.round(o.p[1]) + dy]).find(([x,y]) => walk[y] && walk[y][x]);
        goTo(b, t || o.p); return; } }
    const opts = WANDER[b.id]; goTo(b, opts[Math.random() * opts.length | 0]); b.q.push(() => { b.wait = (240 + Math.random() * 360) * fastF(); });
  }
}
function runTalk() {
  if (!talk) return; const {a, o} = talk;

  if (!talk.ready) { if (a.path.length) return; talk.ready = true; a.dir = Math.sign(o.p[0] - a.p[0]) || 1; o.dir = -a.dir; a.face = a.dir > 0 ? 'east' : 'west'; o.face = o.dir > 0 ? 'east' : 'west'; }
  if (--talk.t > 0) return; talk.i++;
  if (talk.i >= talk.lines.length) { o.wait = 60; a.wait = 60; talk = null; return; }
  const [who, s] = talk.lines[talk.i]; say(B[who], s, ''); talk.t = 170 * fastF();
}
function runMeet() {
  if (!meet || !['briefing', 'debate'].includes(phase) || BOTS.some(b => b.path.length && !b.leaving)) return; if (--meet.t > 0) return;

const seen = {};                          // per bot and day: the events already shown
const sig = e => e[0] + '|' + e[2].slice(0, 30);
function freshEvents(key, ev) {
  const known = seen[key], out = known ? ev.filter(e => !known.has(sig(e))) : ev.slice(-3);   // first look: just the latest few
  seen[key] = new Set(ev.map(sig)); return out;
}
function feedLive() {
  if (mode !== 'live' || !D) return;

  const tw = st.twins || {};
  if (phase === 'trading') BOTS.forEach(b => { const v = twin(b.id) ? tw[b.id] : st.bots[b.id]; if (!v) return;
    freshEvents(b.id + v.day, (v.events || []).filter(e => !['talk', 'decision'].includes(e[1]))).forEach(e => queueEvent(b, e)); });
  if (phase === 'practice') { const day = D.generated.slice(0, 10);
    freshEvents('practice' + day, st.practice.events || []).forEach(e => queueEvent(B.ch, e));

// ===================== replay of the last session =====================
let R = null;
const REPLAY_FRAMES = 150 * 60;          // the trading day plays in about 2.5 minutes
function startReplay() {
  if (!D) return; mode = 'replay'; R = {f: 0, evs: []};
  BOTS.forEach(b => { const ev = evOf(b.id); let n = 0;
    ev.forEach(e => { if (e[1] === 'scan' && (n++ % 6)) return; if (['summary', 'review', 'talk', 'decision'].includes(e[1])) return;
      const [h, m, s] = e[0].split(':').map(Number), sec = h * 3600 + m * 60 + s - (9.5 * 3600);
      if (sec > 6.5 * 3600) return; R.evs.push({f: Math.max(0, sec) / (6.5 * 3600) * REPLAY_FRAMES, b, e}); }); });
  R.evs.sort((x, y) => x.f - y.f); feed.length = 0; log('<span class="d">— replay of the last session —</span>');
  BOTS.forEach(b => { b.p = P['dock_' + b.id].slice(); b.path = []; b.chg = true; });
  enter('trading'); $("replayBtn").textContent = '● BACK TO LIVE'; $("replayLbl").textContent = 'REPLAY';
}
function stopReplay() { mode = 'live'; R = null; $("replayBtn").textContent = '▶ REPLAY LAST SESSION'; $("replayLbl").textContent = 'LIVE'; $("prog").style.width = '0'; phase = null; }
function runReplay() {
  if (mode !== 'replay') return; R.f++;
  while (R.evs.length && R.evs[0].f <= R.f) { const x = R.evs.shift(); queueEvent(x.b, x.e); }
  if (phase === 'trading' && R.f > REPLAY_FRAMES + 240) enter('briefing');
  else if (phase === 'briefing' && meet && meet.done) { R.after = (R.after || 0) + 1; if (R.after > 240) { R.after = 0; enter('study'); } }
  else if (phase === 'study' && BOTS.every(b => !b.q.length && b.chg)) { R.after = (R.after || 0) + 1; if (R.after > 120) { enter('night'); R.end = R.f; } }
  else if (phase === 'night' && R.f - R.end > 600) stopReplay();
  const total = REPLAY_FRAMES + 4200; $("prog").style.width = Math.min(100, R.f / total * 100) + '%';
}
$("replayBtn").onclick = () => mode === 'replay' ? stopReplay() : startReplay();

const a = (c, al) => { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${al})`; };
const glow = (c, b) => { X.shadowColor = c; X.shadowBlur = b; }, noglow = () => { X.shadowBlur = 0; };
const rr = (x, y, w, h, r) => { X.beginPath(); X.roundRect(x, y, w, h, r); };
function txt(s, x, y, c, sz, f) { X.font = `${sz}px ${f || F}`; X.fillStyle = c; X.fillText(s, x, y); }
function panel(x, y, w, h, c) { rr(x, y, w, h, 3); X.fillStyle = '#05080d'; X.fill(); X.strokeStyle = '#1b2129'; X.lineWidth = 2; X.stroke(); X.lineWidth = 1;
  rr(x + 2, y + 2, w - 4, h - 4, 2); X.fillStyle = a(c, .07); X.fill();
  X.fillStyle = 'rgba(255,255,255,.025)'; for (let j = y + 3; j < y + h - 2; j += 3) X.fillRect(x + 3, j, w - 6, 1); }
function wave(x, y, w, amp, c, ph, pts) { X.strokeStyle = c; glow(c, 8); X.beginPath();
  if (pts && pts.length > 2) { const lo = Math.min(...pts), hi = Math.max(...pts), rg = hi - lo || 1; pts.forEach((v, i) => { const px = x + i * w / (pts.length - 1), py = y + amp - (v - lo) / rg * amp * 2; i ? X.lineTo(px, py) : X.moveTo(px, py); }); }
  else for (let i = 0; i <= 40; i++) { const px = x + i * w / 40, py = y - Math.sin(i / 4 + ph) * amp - Math.sin(i * 1.3) * amp * .2; i ? X.lineTo(px, py) : X.moveTo(px, py); }
  X.stroke(); noglow(); }
function terminal(x, y, c) { rr(x * T - 22, y * T - 14, 44, 12, 4); X.fillStyle = '#0b1428'; X.fill(); X.strokeStyle = a(c, .7); X.stroke();
  for (let i = 0; i < 5; i++) { X.fillStyle = a(c, .4 + .4 * Math.sin(tick / 9 + i + x)); X.fillRect(x * T - 18 + i * 8, y * T - 10, 5, 4); }
  panel(x * T - 26, y * T - 46, 52, 28, c); wave(x * T - 22, y * T - 30, 44, 5, c, tick / 20 + x); }

const FLOOR = {deck: 'big', sp: 'plate', ai: 'plate', ch: 'plate', jace: 'plate', jax: 'plate', spare: 'plate',
  brief: 'plate', sim: 'grate', mem: 'big', fac: 'tread', corridor: 'grate'};
function floorFill(g, kind, x, y, w, h, c) {
  const style = FLOOR[kind] || 'plate', s = style === 'big' ? 32 : 16, r = StationArt.rng(x * 7 + y * 13 + w);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#12161e'; g.fillRect(x, y, w, h);
  for (let j = y; j < y + h; j += s) for (let i = x; i < x + w; i += s) {
    const v = r(); g.fillStyle = v < .15 ? '#171c26' : v > .9 ? '#0f131a' : '#151a23'; g.fillRect(i, j, s, s);
    g.fillStyle = '#1d2330'; g.fillRect(i, j, s, 1); g.fillRect(i, j, 1, s);              // lit top/left edge
    g.fillStyle = '#0a0d13'; g.fillRect(i, j + s - 1, s, 1); g.fillRect(i + s - 1, j, 1, s);   // dark seam
    if (style === 'grate') { g.fillStyle = '#0c1017'; for (let k = 3; k < s - 2; k += 3) g.fillRect(i + 3, j + k, s - 6, 1); }
    else if (style === 'tread') { g.fillStyle = '#1b212c'; for (let k = 2; k < s - 2; k += 4) g.fillRect(i + ((k / 4 | 0) % 2 ? 3 : 8), j + k, 4, 1); }
    else { g.fillStyle = '#262d3a'; [[2, 2], [s - 3, 2], [2, s - 3], [s - 3, s - 3]].forEach(([a, b]) => g.fillRect(i + a, j + b, 1, 1)); }
    if (style === 'big') { g.fillStyle = StationArt.hexA(c, .06); g.fillRect(i + 6, j + s / 2, s - 12, 1); }
  }
  g.fillStyle = StationArt.hexA(c, .04); g.fillRect(x, y, w, h);
  g.restore();
}

  X.fillStyle = 'rgba(157,107,255,.4)'; X.fill(); X.strokeStyle = '#c7a8ff'; X.stroke(); noglow();
  const nc = Math.min(4, ((D.station.memory || {}).core || []).length || 3);

function countdown() {

function drawBot(b) {

function step() {

let last = performance.now(), acc = 0;
function loop(now) { acc += Math.min(1000, now - last); last = now; while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; } draw(); requestAnimationFrame(loop); }

// ===================== tap a bot: follow it and open its chat =====================
C.onclick = e => { const r = C.getBoundingClientRect(), mx = (e.clientX - r.left) * 960 / r.width, my = (e.clientY - r.top) * MH / r.height;
  const hit = [...BOTS, SCOUT].find(b => Math.hypot(b.p[0] * T + 8 - mx, b.p[1] * T - 2 - my) < 24);

function chatFor(b) {
