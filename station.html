<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03060f">
<title>Bot Station</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#d8f3ff;--dim:#6f8aa6;--cyan:#22e4ff;--green:#3dffa2;--red:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:#03060f radial-gradient(ellipse at 50% 0,#0b1838 0,#03060f 60%) fixed;color:var(--ink);font:14px/1.45 "Share Tech Mono",ui-monospace,monospace;min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 20px Orbitron,sans-serif;letter-spacing:3px;margin:0;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.spacer{flex:1}
a.btn,button{font:500 11px Orbitron,sans-serif;letter-spacing:1px;background:#08142a;color:var(--cyan);border:1px solid #1f6a9a;border-radius:20px;padding:8px 14px;cursor:pointer;text-decoration:none}
button.on{background:var(--cyan);color:#001;box-shadow:0 0 14px var(--cyan)}
.main{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.stage{flex:0 1 960px;min-width:0}
canvas{display:block;width:100%;height:auto;border:1px solid #1e3a5c;border-radius:10px;box-shadow:0 0 30px #0af3;background:#02040b;cursor:pointer}
.side{flex:1;min-width:270px;display:flex;flex-direction:column;gap:10px}
.box{background:linear-gradient(160deg,#0c1a33cc,#060c1acc);border:1px solid #1f4a72;border-radius:10px;padding:12px;box-shadow:0 0 14px #0af2}
.box h2{font:700 11px Orbitron,sans-serif;letter-spacing:2px;margin:0 0 8px;color:var(--cyan)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.feed{font-size:12px;max-height:340px;overflow:auto}.feed div{padding:5px 0;border-bottom:1px solid #12304d;word-break:break-word}
.g{color:var(--green)}.r{color:var(--red)}.d{color:var(--dim)}
.replay{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}
.bar{flex:1;height:6px;background:#0a1a30;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff3df2,var(--cyan))}
.note{font-size:11px;color:var(--dim)}
.hidden{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock .box{max-width:380px;width:100%}
#lock input[type=password]{width:100%;font:inherit;background:#020812;color:var(--ink);border:1px solid #1f6a9a;border-radius:8px;padding:10px;margin:10px 0}
#follow .k{color:var(--dim)}
@media (max-width:640px){.wrap{padding:12px}h1{font-size:16px}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h2>BOT STATION // LOCKED</h2>
  <p class="note">The data is encrypted. Enter your dashboard password (the same one as Bot HQ).</p>
  <input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
  <label class="note"><input id="rem" type="checkbox" checked> Remember me on this device</label>
  <div style="height:10px"></div><button id="unlock">UNLOCK</button>
  <p class="note" id="lockmsg"></p>
</div></div>

<div id="app" class="wrap hidden">
  <header>
    <h1>BOT STATION</h1><div class="spacer"></div>
    <button id="replayBtn">▶ REPLAY LAST SESSION</button>
    <a class="btn" href="./">BOT HQ</a>
  </header>
  <div class="main">
    <div class="stage"><canvas id="c" width="960" height="800"></canvas></div>
    <div class="side">
      <div class="box"><h2 id="status">CONNECTING…</h2>
        <div class="replay" id="replayRow"><span id="replayLbl">LIVE</span><div class="bar"><i id="prog"></i></div></div></div>
      <div class="box"><h2>UNITS // LAST SESSION</h2><div id="units"></div></div>
      <div class="box hidden" id="follow"></div>
      <div class="box"><h2>STATION LOG</h2><div class="feed" id="feed"></div></div>
      <p class="note">Tap a bot to follow it. Everything shown comes from the bots' real logs; nothing here can place or change a trade.</p>
    </div>
  </div>
</div>

<script>
// ===================== unlock (same scheme and saved key as Bot HQ) =====================
const DATA_URL = "https://raw.githubusercontent.com/Barry-Lenhart/bot-dashboard/data/data.enc.json";
const STORE = "bothq.key.v1";
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveRaw(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter}, base, 256);
}
async function decrypt(box, raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(box.iv)}, key, b64d(box.ct))));
}
const saved = () => { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch { return null; } };
const save = v => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} };
async function fetchBox() { const r = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) throw new Error("Couldn't download the data (" + r.status + ")"); return r.json(); }
let session = null, box = null;
async function boot() {
  try { box = await fetchBox(); } catch (e) { $("lockmsg").textContent = e.message; return; }
  const s = saved();
  if (s && s.salt === box.salt) { try { const d = await decrypt(box, b64d(s.raw)); session = {salt: s.salt, raw: b64d(s.raw)}; return start(d); } catch {} }
  $("pw").focus();
}
async function unlock() {
  const pw = $("pw").value; if (!pw) return;
  $("lockmsg").textContent = "Unlocking…";
  try { box = await fetchBox(); const raw = await deriveRaw(pw, box.salt, box.iter); const d = await decrypt(box, raw);
    session = {salt: box.salt, raw}; if ($("rem").checked) save({salt: box.salt, raw: b64e(raw)}); $("pw").value = ""; start(d);
  } catch (e) { $("lockmsg").textContent = "Wrong password, or the data couldn't be read."; }
}
async function refresh() {
  try { box = await fetchBox(); if (session.salt !== box.salt) { save(null); location.reload(); return; } setData(await decrypt(box, session.raw)); } catch {}
}
$("unlock").onclick = unlock; $("pw").onkeydown = e => { if (e.key === "Enter") unlock(); };

// ===================== the station map =====================
const C = $("c"), X = C.getContext("2d"), T = 16, W = 60, H = 50, F = '"Share Tech Mono",monospace';
const ROOMS = [
  {x:0,y:2,w:16,h:13,l:"POD 01 // SPENCER",c:'#4da3ff'}, {x:0,y:15,w:16,h:12,l:"POD 02 // AVA",c:'#ffb03d'},
  {x:16,y:2,w:28,h:25,l:"COMMAND DECK",c:'#22e4ff'}, {x:44,y:2,w:16,h:13,l:"POD 03 // CHAD",c:'#3dffa2'},
  {x:44,y:15,w:16,h:12,l:"MEMORY CORE",c:'#9d6bff'}, {x:0,y:27,w:30,h:13,l:"BRIEFING ROOM",c:'#ff3df2'},
  {x:30,y:27,w:30,h:13,l:"SIMULATION CHAMBER",c:'#22ffd5'},
  {x:0,y:40,w:30,h:9,l:"POD 04 // JACE (TWIN)",c:'#ff5fa2'}, {x:30,y:40,w:30,h:9,l:"POD 05 // JAX (TWIN)",c:'#ffe14d'}];
const wall = [...Array(H)].map(() => Array(W).fill(false));
ROOMS.forEach(r => { for (let i = r.x; i < r.x + r.w; i++) { wall[r.y][i] = true; wall[Math.min(r.y + r.h, H - 1)][i] = true; }
  for (let j = r.y; j <= Math.min(r.y + r.h, H - 1); j++) { wall[j][r.x] = true; wall[j][Math.min(r.x + r.w, W - 1)] = true; } });
const DOORS = [[16,7,1,3],[16,19,1,3],[44,7,1,3],[44,19,1,3],[6,15,3,1],[50,15,3,1],[10,27,3,1],[21,27,4,1],[35,27,4,1],[50,27,3,1],[30,32,1,3],[10,40,3,1],[46,40,3,1],[30,43,1,3]];
DOORS.forEach(([x,y,w,h]) => { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) wall[y + j][x + i] = false; });
function path(a, b) {
  const k = (x, y) => y * W + x, sx = Math.round(a[0]), sy = Math.round(a[1]), tx = Math.round(b[0]), ty = Math.round(b[1]);
  const prev = new Map([[k(sx, sy), -1]]), q = [[sx, sy]];
  while (q.length) { const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || wall[ny][nx] || prev.has(k(nx, ny))) continue; prev.set(k(nx, ny), k(x, y)); q.push([nx, ny]); } }
  if (!prev.has(k(tx, ty))) return [];
  const out = []; let c = k(tx, ty); while (c !== -1) { out.unshift([c % W, Math.floor(c / W)]); c = prev.get(c); }
  const s = []; out.forEach((p, i) => { if (i === 0 || i === out.length - 1) { s.push(p); return; } const p0 = out[i - 1], p1 = out[i + 1];
    if (p0[0] - p[0] !== p[0] - p1[0] || p0[1] - p[1] !== p[1] - p1[1]) s.push(p); });
  s.shift(); s.push(b); return s;
}
const P = {desk_sp:[8,7],desk_ai:[8,20],desk_ch:[52,7],screen:[30,9],screen2:[26,9],news:[20,14],globe:[30,19],globe2:[35,21],
  crystal:[51,21],seat_sp:[9,34.6],seat_ai:[15,34.2],seat_ch:[21,34.6],dock_sp:[5,11],dock_ai:[5,23],dock_ch:[55,11],
  sim:[42,33],sim2:[38,31],sim3:[44,36],lounge:[24,23],term1:[36,13],term2:[36,24],term3:[21,24],pod_sp:[11,11],pod_ai:[11,23],pod_ch:[48,11],
  desk_jace:[8,46.5],dock_jace:[4,46],pod_jace:[26,46],desk_jax:[52,46.5],dock_jax:[56,46],pod_jax:[33,46],
  seat_jace:[25,34.2],seat_jax:[4,34.2],sim_jace:[35,31],sim_jace2:[36,37],sim_jax:[40,37],sim_jax2:[44,30]};
const WANDER = {sp:['desk_sp','screen','lounge','pod_sp','globe'], ai:['desk_ai','news','globe2','term3','pod_ai'],
  ch:['desk_ch','screen2','globe','term1','term2','news','pod_ch'],
  jace:['desk_jace','pod_jace','screen','term3','news','lounge'], jax:['desk_jax','pod_jax','screen2','globe2','term1','term2']};
const TWINS = ['jace', 'jax'], twin = id => TWINS.includes(id);

// ===================== bots =====================
const BOTS = [{id:'sp',name:'SPENCER',role:'S&P bot · real money',col:'#4da3ff'},{id:'ai',name:'AVA',role:'AI day trader · paper',col:'#ffb03d'},
  {id:'ch',name:'CHAD',role:'chatbot · paper · the control',col:'#3dffa2'},
  {id:'jace',name:'JACE',role:'twin · simulated',col:'#ff5fa2'},{id:'jax',name:'JAX',role:'twin · simulated',col:'#ffe14d'}];
const B = {}; BOTS.forEach(b => { B[b.id] = b; Object.assign(b, {p:P['dock_' + b.id].slice(), path:[], dir:1, walk:0, say:null, sayT:0, wait:0,
  q:[], evq:[], chg:true, speak:0, recent:[]}); });
let boardTitle = 'BRIEFING // DAILY RESULTS', D = null, tick = 0, talk = null, board = [], meet = null, phase = null, mode = 'live', following = null;
const floaters = [], feed = [];
const clean = s => (s || '').replace(/\s*--\s*\d{4}-\d\d-\d\d/g, '').replace(/\b\d{4}-\d\d-\d\d\b/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B1C}\u{2B1B}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();
const first = s => clean((s || '').replace(/^switch ON \| /, 'Checked: ').split(' | ')[0]);
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(html) { feed.unshift(html); feed.length = Math.min(feed.length, 40); $("feed").innerHTML = feed.map(x => '<div>' + x + '</div>').join(''); }
function say(b, text, cls, full) {
  b.say = cut(text, 58); b.sayT = 240;
  log(`<span class="${cls || ''}"><b style="color:${b.col}">${b.name}:</b> ${esc(cut(full || text, 260))}</span>`);
  b.recent.unshift(full || text); b.recent.length = Math.min(b.recent.length, 6); if (following === b) showFollow();
}
function goTo(b, place) { b.chg = false; b.path = path(b.p, typeof place === 'string' ? P[place] : place); }
function charge(b) { if (b.chg) return; goTo(b, 'dock_' + b.id); b.q.push(() => { b.chg = true; }); }
function fastF() { return mode === 'replay' ? 0.4 : 1; }     // replay moves the story along faster

// what a real event looks like on the station: where the bot walks, and what it says there
function placeFor(bot, kind, text) {
  if (phase === 'practice') return twin(bot) ? ['sim_' + bot, 'sim_' + bot + '2'][text.length % 2] : ['sim', 'sim2', 'sim3'][text.length % 3];
  if (kind === 'buy' || kind === 'sell' || kind === 'order' || kind === 'plan' || kind === 'check') return 'desk_' + bot;
  if (kind === 'news' || kind === 'brief' || /headline|news/i.test(text)) return 'news';
  if (kind === 'note') return 'crystal';
  if (kind === 'watch') return 'globe2';
  if (bot === 'ch' || twin(bot)) return ['screen2', 'globe', 'term1', 'term2', 'screen'][(text.length) % 5];
  return bot === 'sp' ? 'screen' : 'term3';
}
function act(b, ev) {
  const [, kind, text] = ev, place = placeFor(b.id, kind, text);
  goTo(b, place);
  b.q.push(() => {
    const cls = kind === 'buy' ? 'g' : kind === 'sell' ? (/-\d|−/.test(first(text)) ? 'r' : 'g') : kind === 'think' || kind === 'scan' ? 'd' : '';
    say(b, kind === 'note' ? 'note: ' + first(text) : first(text), cls, clean(text));
    if (kind === 'sell') { const m = first(text).match(/([+\-−]\d+(\.\d+)?%)/); if (m) floaters.push({x:b.p[0]*T+8, y:b.p[1]*T-30, t:0, s:m[1], c: /[-−]/.test(m[1]) ? '#ff4d6d' : '#3dffa2'}); }
    if (kind === 'buy') floaters.push({x:b.p[0]*T+8, y:b.p[1]*T-30, t:0, s:'BUY', c:'#3dffa2'});
    b.wait = (kind === 'think' ? 260 : 200) * fastF();
  });
}
function queueEvent(b, ev) {
  b.evq.push(ev);
  const keep = e => ['buy', 'sell', 'order', 'summary', 'review'].includes(e[1]);
  while (b.evq.length > 3) { const i = b.evq.findIndex(e => !keep(e)); b.evq.splice(i < 0 ? 0 : i, 1); }   // never fall far behind
}

// ===================== facts for small talk (only things the bots really did) =====================
function evOf(bot) { return twin(bot) ? (((D.station.twins || {})[bot] || {}).events || []) : (D.station.bots[bot].events || []); }
function lastOf(bot, kinds) { const ev = D ? evOf(bot) : []; for (let i = ev.length - 1; i >= 0; i--) if (kinds.includes(ev[i][1])) return ev[i]; return null; }
function dayLine(bot) {
  if (twin(bot)) { const c = D[bot] || {}; const n = (c.trades || []).filter(t => t.day === c.day).length; return `${n} sale${n === 1 ? '' : 's'} so far, ${fmtPct(pct(bot))} on the day.`; }
  if (bot === 'ch') { const c = D.chat || {}; const n = (c.trades || []).filter(t => t.day === (c.day)).length; return `${n} sale${n === 1 ? '' : 's'} so far, ${fmtPct(pct('ch'))} on the day.`; }
  if (bot === 'ai') { const a = D.ai || {}; return a.hold ? `Holding ${a.hold.sym}. ${fmtPct(pct('ai'))} on the day.` : `No position right now. ${fmtPct(pct('ai'))} on the day.`; }
  const l = D.live || {}; return `Holding ${(l.positions || []).map(p => p.sym).join(' and ') || 'cash'}. ${fmtPct(pct('sp'))} on the day.`;
}
function makeTalk(a, o) {
  const opts = [];
  const cb = lastOf(o.id, ['buy']), parts = cb ? cb[2].split(' | ') : [];
  if ((o.id === 'ch' || twin(o.id)) && cb) opts.push([[a.id, `Saw you ${first(parts[0]).replace('BOUGHT', 'bought').replace(/\(.*?\)/, '').trim()}. Plan?`], [o.id, clean(parts[1] || 'Watching it closely.')]]);
  const an = lastOf('ai', ['news', 'watch']);
  if (o.id === 'ai' && an) opts.push([[a.id, 'Anything in the news?'], ['ai', first(an[2])]]);
  opts.push([[a.id, 'How is your day going?'], [o.id, dayLine(o.id)], [a.id, dayLine(a.id)]]);
  return opts[(tick / 7 | 0) % opts.length];
}

// ===================== results =====================
function sessionDay() { const m = D.station.market; return m.is_open ? D.generated.slice(0, 10) : (m.last_close || '').slice(0, 10); }
function pct(bot) {
  const s = bot === 'sp' ? D.live : bot === 'ai' ? D.ai : bot === 'ch' ? D.chat : D[bot]; if (!s || s.error) return null;
  if (!s.history || !s.history.length) return s.equity && s.start_equity ? s.equity / s.start_equity - 1 : null;
  const h = s.history.filter(x => x.eq), last = h[h.length - 1];
  if (!last) return null;
  const prev = h.length >= 2 ? h[h.length - 2].eq : (s.start_equity || s.put_in);
  if (last.d === sessionDay() && prev) return (last.eq - (last.dep || 0)) / prev - 1;
  return s.equity / last.eq - 1;
}
const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
function units() {
  $("units").innerHTML = BOTS.map(b => { const v = pct(b.id);
    return `<div class="row"><span style="color:${b.col}">◆ ${b.name} <span class="d">· ${b.role.split(' · ')[0]}</span></span><span class="${v == null ? 'd' : v >= 0 ? 'g' : 'r'}">${fmtPct(v)}</span></div>`; }).join('');
}
function briefingLines() {
  const L = [];
  const sw = lastOf('sp', ['summary']); L.push(['sp', sw ? clean(sw[2].split(' | ').slice(1, 3).join(' · ')) : `${fmtPct(pct('sp'))} on the day.`]);
  const at = (D.ai.trades || []).filter(t => t.day === sessionDay());
  L.push(['ai', at.length ? `${at.length} trade${at.length > 1 ? 's' : ''}: ` + at.map(t => `${t.sym} ${fmtPct(t.pct)}`).join(', ') : `No trades. ${fmtPct(pct('ai'))} on the day.`]);
  const cs = lastOf('ch', ['summary']);
  if (cs) { const p = cs[2].split(' | '); L.push(['ch', clean(p.find(x => /trades/.test(x)) || p[1] || '')]);
    const tm = p.find(x => /Tomorrow/i.test(x)); if (tm) L.push(['ch', cut(clean(tm), 110)]); }
  else L.push(['ch', `${fmtPct(pct('ch'))} on the day.`]);
  TWINS.forEach(id => { if (!twinsOn()) return; const s = lastOf(id, ['summary']);
    L.push([id, s ? clean(s[2].split(' | ').find(x => /trades|sales/.test(x)) || s[2].split(' | ')[1] || '') : `${fmtPct(pct(id))} on the day.`]); });
  const dbt = debateToday();
  if (dbt) { L.push(['_leave']);                          // Chad is the control: he leaves before the twins talk
    dbt.talk.forEach(([w, t]) => L.push([w, t, 'talk']));
    TWINS.forEach(id => { const d = (dbt.decisions || {})[id]; if (d && d.summary) L.push([id, 'decided: ' + d.summary, 'talk']); }); }
  return L;
}
function twinsOn() { return !!(D.station.twins && D.jace && !D.jace.error); }
function debateToday() { const d = (D.station.twins || {}).debate; return d && d.date === sessionDay() ? d : null; }
function recentDebate() { const d = (D.station.twins || {}).debate; return d && Date.now() / 1000 - d.t < 1200 ? d : null; }
function twinStudy(id) { const c = (D[id] || {}).core || []; return [`reviewing my day… ${c.length} core lessons`].concat(c.slice(0, 2).map((x, i) => `core #${i + 1}: ` + x)); }
function studyLines() {
  const m = D.station.memory || {}, L = [`reviewing… ${(m.core || []).length} core lessons, ${m.library || 0} in the library`];
  (m.core || []).slice(0, 4).forEach((c, i) => L.push(`core #${i + 1}: ` + c));
  (m.wishlist || []).slice(0, 1).forEach(w => w && L.push('wishlist: ' + w));
  return L;
}

// ===================== phases (the hidden schedule) =====================
const STATUS = {trading:'MARKET OPEN // TRADING', briefing:'MARKET CLOSED // DAILY BRIEFING', study:'CHAD REVIEWING LESSONS',
  night:'AFTER HOURS // UNITS CHARGING', weekend:'WEEKEND // UNITS CHARGING', practice:'WEEKEND // PRACTICE IN THE SIMULATOR',
  debate:'TWIN DISCUSSION // CHAD NOT INVITED'};
function practicing(id) { return id === 'ch' ? D.station.practice.running : twin(id) && ((D.station.twins || {})[id] || {}).practicing; }
function livePhase() {
  const m = D.station.market, now = Date.now();
  if (m.is_open) return 'trading';
  const since = (now - Date.parse(m.last_close)) / 60000, gapDays = (Date.parse(m.next_open) - Date.parse(m.last_close)) / 864e5;
  if (since >= 0 && since < 20) return 'briefing';

  rr(x - 8, y - 9 + bob, 16, 15, 4); X.fillStyle = '#d9e6f5'; X.fill(); X.fillStyle = '#9fb3cc'; X.fillRect(x - 8, y + 2 + bob, 16, 4);
  glow(c, 10); X.fillStyle = c; X.beginPath(); X.arc(x, y - 2 + bob, 2.6, 0, 7); X.fill(); noglow();
  X.fillStyle = '#b9c9dd'; X.fillRect(x - 11, y - 7 + bob - lg * .4, 3, 10); X.fillRect(x + 8, y - 7 + bob + lg * .4, 3, 10);
  rr(x - 8, y - 24 + bob, 16, 14, 6); X.fillStyle = '#eef4fb'; X.fill(); rr(x - 6, y - 20 + bob, 12, 6, 3); X.fillStyle = '#061021'; X.fill();
  glow(c, 10); X.fillStyle = c; const ex = b.dir > 0 ? 1 : -1, bl = (tick + x) % 140 < 5;
  X.fillRect(x - 4 + ex, y - 18 + bob, 3, bl ? 1 : 2); X.fillRect(x + 1 + ex, y - 18 + bob, 3, bl ? 1 : 2);
  X.fillRect(x - 1, y - 29 + bob, 2, 5); X.beginPath(); X.arc(x, y - 30 + bob, 2.2, 0, 7); X.fill(); noglow();
  const docked = b.chg && !mv;
  if (docked) { const [pc, left] = countdown(), up = (tick * 1.5) % 30;
    X.fillStyle = a(c, .12 + .08 * Math.sin(tick / 10)); X.fillRect(x - 12, y - 34, 24, 48);
    for (let k = 0; k < 3; k++) { const yy = y + 12 - ((up + k * 10) % 30) * 1.5; X.fillStyle = a(c, .6); X.fillRect(x - 10 + k * 9, yy, 2, 5); }
    const bx = x - 44, by = y - 58; rr(bx, by, 88, 28, 5); X.fillStyle = 'rgba(5,12,26,.94)'; X.fill(); X.strokeStyle = a(c, .8); X.stroke();
    X.fillStyle = '#0a1a30'; X.fillRect(bx + 6, by + 6, 76, 6); glow(c, 8); X.fillStyle = c; X.fillRect(bx + 6, by + 6, Math.max(2, 76 * pc), 6); noglow();
    txt(Math.round(pc * 100) + '%', bx + 6, by + 23, c, 10); txt(left, bx + 34, by + 23, '#eafcff', 10);
    txt('CHARGING // OPENS IN', x - 44, by - 4, a(c, .85), 7, '700 Orbitron'); }
  if (b.speak > 0) { X.beginPath(); X.ellipse(x, y + 15, 16 + Math.sin(tick / 5) * 2, 5, 0, 0, 7); glow(c, 16); X.strokeStyle = c; X.lineWidth = 2; X.stroke(); X.lineWidth = 1; noglow();
    txt('◆ speaking', x - 26, y - 31, c, 9, '700 Orbitron'); }
  X.font = '700 8px Orbitron'; const nw = X.measureText(b.name).width; txt(b.name, x - nw / 2, y + 26, c, 8, '700 Orbitron');
  if (b.say && b.sayT > 0 && !docked && phase !== 'briefing') { X.font = `11px ${F}`; const w = Math.min(X.measureText(b.say).width + 16, 360), bx = Math.min(Math.max(x - w / 2, 4), 956 - w), by = y - 58;
    rr(bx, by, w, 20, 8); X.fillStyle = 'rgba(5,12,26,.94)'; X.fill(); glow(c, 10); X.strokeStyle = c; X.stroke(); noglow();
    X.beginPath(); X.moveTo(x - 4, by + 20); X.lineTo(x, by + 27); X.lineTo(x + 4, by + 20); X.fillStyle = c; X.fill();
    X.save(); X.beginPath(); X.rect(bx, by, w, 20); X.clip(); txt(b.say, bx + 8, by + 14, '#eafcff', 11); X.restore(); }
}
function step() {
  tick++; runReplay(); runTalk(); runMeet();
  floaters.forEach(f => f.t++); while (floaters.length && floaters[0].t > 120) floaters.shift();
  BOTS.forEach(b => { if (b.sayT > 0) b.sayT--; if (b.speak > 0) b.speak--;
    if (b.path.length) { const t = b.path[0], dx = t[0] - b.p[0], dy = t[1] - b.p[1], d = Math.hypot(dx, dy), s = mode === 'replay' ? .16 : .085;
      if (dx) b.dir = Math.sign(dx); b.walk += .35; if (d < s) { b.p = [t[0], t[1]]; b.path.shift(); } else { b.p[0] += dx / d * s; b.p[1] += dy / d * s; } return; }
    if (b.wait > 0) { b.wait--; return; } next(b); });
}
function draw() {
  drawMap(); [...BOTS].sort((p, q) => p.p[1] - q.p[1]).forEach(drawBot);
  floaters.forEach(f => { glow(f.c, 10); txt(f.s, f.x - 14, f.y - f.t * .4, a(f.c, 1 - f.t / 120), 13, '700 Orbitron'); noglow(); });
}
let last = performance.now(), acc = 0;
function loop(now) { acc += Math.min(1000, now - last); last = now; while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; } draw(); requestAnimationFrame(loop); }

// ===================== follow a bot =====================
C.onclick = e => { const r = C.getBoundingClientRect(), mx = (e.clientX - r.left) * 960 / r.width, my = (e.clientY - r.top) * 800 / r.height;
  const hit = BOTS.find(b => Math.hypot(b.p[0] * T + 8 - mx, b.p[1] * T - 2 - my) < 24); following = hit && hit !== following ? hit : null; showFollow(); };
function showFollow() {
  const el = $("follow"); if (!following) { el.classList.add('hidden'); return; } el.classList.remove('hidden'); const b = following;
  let pos = [];
  if (b.id === 'sp') pos = (D.live.positions || []).map(p => `${p.sym} · $${p.value.toFixed(2)}`);
  if (b.id === 'ai') pos = D.ai.hold ? [`${D.ai.hold.sym} · ${D.ai.hold.qty} shares @ $${D.ai.hold.entry}`] : [];
  if (twin(b.id)) pos = ((D[b.id] || {}).positions || []).map(p => `${p.sym} · ${(+p.qty).toFixed(4).replace(/\.?0+$/, '')} @ $${(+p.entry).toFixed(2)} · <span class="${p.pct >= 0 ? 'g' : 'r'}">${fmtPct(p.pct)}</span>`);
  if (b.id === 'ch') pos = (D.chat.positions || []).map(p => `${p.sym} · ${p.qty} @ $${p.entry} · <span class="${p.pct >= 0 ? 'g' : 'r'}">${fmtPct(p.pct)}</span>`);
  el.innerHTML = `<h2 style="color:${b.col}">FOLLOWING // ${b.name}</h2><div class="note">${b.role}</div>
    <div class="row"><span class="k">Today</span><span>${fmtPct(pct(b.id))}</span></div>
    <div class="k" style="margin-top:6px">Holding</div><div class="feed">${pos.length ? pos.map(p => '<div>' + p + '</div>').join('') : '<div class="d">nothing</div>'}</div>
    <div class="k" style="margin-top:6px">Latest</div><div class="feed">${b.recent.length ? b.recent.map(r => '<div>' + esc(cut(r, 300)) + '</div>').join('') : '<div class="d">nothing yet</div>'}</div>`;
}

// ===================== wiring =====================
function setData(d) { D = d; if (d.station && !d.station.error) { units(); buildTape(); feedLive(); if (following) showFollow(); } }
function start(d) {
  $("lock").classList.add('hidden'); $("app").classList.remove('hidden');
  if (!d.station || d.station.error) { $("status").textContent = 'STATION DATA NOT READY YET'; return; }
  setData(d);
  setInterval(() => { if (mode === 'live') { const ph = livePhase(); if (ph !== phase) { enter(ph); feedLive(); } } }, 1000);
  enter(livePhase()); feedLive(); requestAnimationFrame(loop);
  setInterval(refresh, 120000);
}
boot();
